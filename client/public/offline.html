<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline - EIRS Technology</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      img { width: 96px; height: 96px; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #1a73e8; }
      p { font-size: 15px; color: #555; max-width: 320px; line-height: 1.5; }
      button {
        margin-top: 20px;
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        background: #1a73e8;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="icons/icon-96x96.png" alt="EIRS Technology" />
      <h1>You're offline</h1>
      <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
